<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Evidence GHB ztrát</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="logoghb.png">
</head>
<body>

<!-- horni panel-->
<header class="navbar">
    <div class="nav-left">
        <img src="logoghb.png" class="logo">
        <span class="title">Evidence věcí</span>
    </div>

    <div class="nav-center">
        <button id="openFound" class="btn-found">Nalezená</button>
        <button id="openLost" class="btn-lost">Ztracená</button>
    </div>

    <button class="login-btn" id="loginBtn">Přihlásit se</button>
</header>

<main class="content">
    <div id="cards" class="cards"></div>
</main>

<!-- Formulář přidání věci -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h2>Přidat věc</h2>
        <input id="name" type="text" placeholder="Název věci">
        <input id="date" type="date">
        <input id="place" type="text" placeholder="Místo">
        <textarea id="desc" placeholder="Popis"></textarea>
        <input id="image" type="file" accept="image/*">
        <select id="status">
            <option value="found">Nalezená</option>
            <option value="lost">Ztracená</option>
        </select>
        <div class="modal-actions">
            <button id="cancel" class="btn-outline">Zrušit</button>
            <button id="save" class="btn-primary">Uložit</button>
        </div>
    </div>
</div>

<!-- Login modal -->
<div class="modal" id="loginModal">
    <div class="modal-box">
        <h2>Přihlášení</h2>
        <input id="loginEmail" type="email" placeholder="E-mail">
        <input id="loginPass" type="password" placeholder="Heslo">
        <p id="loginError" style="color:#ef4444;font-size:13px;display:none;"></p>
        <div class="modal-actions">
            <button id="loginCancel" class="btn-outline">Zrušit</button>
            <button id="loginSubmit" class="btn-primary">Přihlásit</button>
        </div>
    </div>
</div>

<!-- Loading overlay -->
<div id="loadingOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:999; align-items:center; justify-content:center;">
    <div style="background:white; padding:24px 36px; border-radius:16px; font-weight:600; font-size:16px;">Ukládám...</div>
</div>

<!-- Firebase SDK (compat verze - jednodušší API) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
